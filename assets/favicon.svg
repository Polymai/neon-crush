<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Neon Crush favicon</title>
  <desc id="desc">A glowing gem tile with the letters NC.</desc>
  <defs>
    <linearGradient id="gem" x1="8" x2="56" y1="8" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.45" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="12" fill="#070a1f"/>
  <path d="M32 6 56 20v28L32 62 8 48V20L32 6Z" fill="url(#gem)" filter="url(#glow)"/>
  <path d="M18 22h28l8 10-22 26L10 32l8-10Z" fill="#ffffff" opacity=".14"/>
  <path d="M18 22h28l8 10-22 26L10 32l8-10Z" fill="none" stroke="#f8fafc" stroke-width="2" opacity=".7"/>
  <text x="32" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="17" fill="#061021">NC</text>
</svg>
